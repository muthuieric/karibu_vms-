name: Security Audit & CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Weekly scan every Monday at 04:00 UTC

jobs:
  security-audit:
    name: Dependency Audit & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Karibu VMS Secret & Vulnerability Scan
        run: node scripts/security-audit.mjs

      - name: Run Self-Testing Security Verification
        run: node scripts/self-test-security.mjs

      - name: Audit npm dependencies for known CVEs
        run: npm audit --audit-level=high

  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

